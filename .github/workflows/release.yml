name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # A tag must not be publishable unless the code behind it passes the same gate every
  # push and pull request goes through.
  quality:
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          VERSION_NUMBER="${VERSION#v}"

          # A missing section used to fall back to a generic body, so a release could go out
          # green with empty notes. Better to stop and add the section.
          if ! grep -q "## \[${VERSION_NUMBER}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION_NUMBER}. Add it before tagging."
            exit 1
          fi

          # A range like /## \[x\]/,/^## \[/ closes on its own opening line, because the end
          # pattern matches it too: this always emitted just the header, which sed and tail
          # then stripped to nothing. Track the section explicitly instead.
          awk -v header="## [${VERSION_NUMBER}]" '
            index($0, header) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && /^---[[:space:]]*$/ { next }
            inside { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::The CHANGELOG section for ${VERSION_NUMBER} is empty."
            exit 1
          fi

          # Add installation instructions
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "composer require agenziasmart/swotto" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Documentation" >> release_notes.md
          echo "" >> release_notes.md
          echo "- [README](https://github.com/agenziasmart/swotto#readme)" >> release_notes.md
          echo "- [CHANGELOG](https://github.com/agenziasmart/swotto/blob/master/CHANGELOG.md)" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        run: |
          echo "✅ Release ${{ steps.version.outputs.VERSION }} created successfully!"
          echo "📦 Packagist will auto-update within a few minutes"
